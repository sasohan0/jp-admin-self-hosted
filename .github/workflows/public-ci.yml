name: Self-hosted package checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test
      - name: JavaScript syntax
        shell: bash
        run: |
          while IFS= read -r file; do
            node --check "$file"
          done < <(find . -path ./node_modules -prune -o -name '*.js' -type f -print)
